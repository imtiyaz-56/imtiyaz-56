<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="420" height="360" role="img" aria-label="Technical Skills">

<defs><style><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes shineX{0%{transform:translateX(-140px)}60%,100%{transform:translateX(460px)}}
.row{opacity:0;animation:fadeUp .5s ease forwards}
.sh{animation:shineX 4s ease-in-out 2.2s infinite}
]]></style>

<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%">
    <animate attributeName="stop-color"
             values="#60a5fa;#38bdf8;#60a5fa"
             dur="6s"
             repeatCount="indefinite"/>
  </stop>
  <stop offset="100%">
    <animate attributeName="stop-color"
             values="#38bdf8;#60a5fa;#38bdf8"
             dur="6s"
             repeatCount="indefinite"/>
  </stop>
</linearGradient>

<linearGradient id="shg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#fff" stop-opacity=".08"/>
  <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>

<clipPath id="cardc">
  <rect x="1" y="1" width="418" height="358" rx="14"/>
</clipPath>

</defs>

<!-- Main Card -->
<rect x="1"
      y="1"
      width="418"
      height="358"
      rx="14"
      fill="#170e28"
      stroke="url(#tg)"
      stroke-width="1.5"/>

<!-- Title -->
<text x="20"
      y="34"
      font-size="25"
      font-weight="bold"
      fill="url(#tg)">💻 Technical Skills</text>

<!-- HTML -->
<g class="row" style="animation-delay:0.90s">
  <circle cx="26" cy="91" r="5" fill="#E34F26"/>
  <text x="40" y="96" font-size="13" fill="#e6edf3" font-weight="bold">HTML</text>
  <text x="396" y="96" text-anchor="end" font-size="13" fill="#E34F26" font-weight="bold">75%</text>
  <rect x="40" y="104" width="268" height="9" rx="4.5" fill="#241740"/>
  <rect x="40" y="104" width="201" height="9" rx="4.5" fill="#E34F26">
    <animate attributeName="width"
             from="0"
             to="201"
             dur="1.1s"
             begin="1.05s"
             fill="freeze"
             calcMode="spline"
             keySplines=".2 .8 .3 1"/>
  </rect>
</g>

<!-- CSS -->
<g class="row" style="animation-delay:1.25s">
  <circle cx="26" cy="137" r="5" fill="#1572B6"/>
  <text x="40" y="142" font-size="13" fill="#e6edf3" font-weight="bold">CSS</text>
  <text x="396" y="142" text-anchor="end" font-size="13" fill="#1572B6" font-weight="bold">50%</text>
  <rect x="40" y="150" width="268" height="9" rx="4.5" fill="#241740"/>
  <rect x="40" y="150" width="134" height="9" rx="4.5" fill="#1572B6">
    <animate attributeName="width"
             from="0"
             to="134"
             dur="1.1s"
             begin="1.40s"
             fill="freeze"
             calcMode="spline"
             keySplines=".2 .8 .3 1"/>
  </rect>
</g>

<!-- JavaScript -->
<g class="row" style="animation-delay:1.60s">
  <circle cx="26" cy="183" r="5" fill="#F7DF1E"/>
  <text x="40" y="188" font-size="13" fill="#e6edf3" font-weight="bold">JavaScript</text>
  <text x="396" y="188" text-anchor="end" font-size="13" fill="#F7DF1E" font-weight="bold">45%</text>
  <rect x="40" y="196" width="268" height="9" rx="4.5" fill="#241740"/>
  <rect x="40" y="196" width="120.6" height="9" rx="4.5" fill="#F7DF1E">
    <animate attributeName="width"
             from="0"
             to="120.6"
             dur="1.1s"
             begin="1.75s"
             fill="freeze"
             calcMode="spline"
             keySplines=".2 .8 .3 1"/>
  </rect>
</g>

<!-- Python -->
<g class="row" style="animation-delay:1.95s">
  <circle cx="26" cy="229" r="5" fill="#3776AB"/>
  <text x="40" y="234" font-size="13" fill="#e6edf3" font-weight="bold">Python</text>
  <text x="396" y="234" text-anchor="end" font-size="13" fill="#3776AB" font-weight="bold">39%</text>
  <rect x="40" y="242" width="268" height="9" rx="4.5" fill="#241740"/>
  <rect x="40" y="242" width="104.52" height="9" rx="4.5" fill="#3776AB">
    <animate attributeName="width"
             from="0"
             to="104.52"
             dur="1.1s"
             begin="2.10s"
             fill="freeze"
             calcMode="spline"
             keySplines=".2 .8 .3 1"/>
  </rect>
</g>

<!-- SQL -->
<g class="row" style="animation-delay:2.30s">
  <circle cx="26" cy="275" r="5" fill="#336791"/>
  <text x="40" y="280" font-size="13" fill="#e6edf3" font-weight="bold">SQL</text>
  <text x="396" y="280" text-anchor="end" font-size="13" fill="#336791" font-weight="bold">60%</text>
  <rect x="40" y="288" width="268" height="9" rx="4.5" fill="#241740"/>
  <rect x="40" y="288" width="160.8" height="9" rx="4.5" fill="#336791">
    <animate attributeName="width"
             from="0"
             to="160.8"
             dur="1.1s"
             begin="2.45s"
             fill="freeze"
             calcMode="spline"
             keySplines=".2 .8 .3 1"/>
  </rect>
</g>

<!-- Java -->
<g class="row" style="animation-delay:2.55s">
  <circle cx="26" cy="321" r="5" fill="#ED8B00"/>
  <text x="40" y="326" font-size="13" fill="#e6edf3" font-weight="bold">Java</text>
  <text x="396" y="326" text-anchor="end" font-size="13" fill="#ED8B00" font-weight="bold">60%</text>
  <rect x="40" y="334" width="268" height="9" rx="4.5" fill="#241740"/>
  <rect x="40" y="334" width="160.8" height="9" rx="4.5" fill="#ED8B00">
    <animate attributeName="width"
             from="0"
             to="160.8"
             dur="1.1s"
             begin="2.70s"
             fill="freeze"
             calcMode="spline"
             keySplines=".2 .8 .3 1"/>
  </rect>
</g>

<!-- Shine -->
<g clip-path="url(#cardc)">
  <rect class="sh"
        x="0"
        y="0"
        width="100"
        height="360"
        fill="url(#shg)"
        transform="skewX(-15)"/>
</g>

</svg>